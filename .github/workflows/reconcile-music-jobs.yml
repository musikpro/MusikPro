name: Reconcile music jobs

# Filet de sécurité : le plan Vercel Hobby limite les crons à 1 exécution/jour. Ce workflow appelle toutes les
# 5 minutes la même route que le cron Vercel (/api/cron/reconcile-music-jobs) pour finaliser, faire échouer ou
# rembourser les générations musicales restées « processing » quand le client a fermé la page.
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   CRON_SECRET (secret)  — même valeur que CRON_SECRET en production sur Vercel.
#   APP_URL (variable)    — optionnel, défaut https://musikpro.net

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reconcile-music-jobs
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Appeler la route de rattrapage
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://musikpro.net' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET absent : secret GitHub à créer." >&2
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 90 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/reconcile-music-jobs")
          echo "HTTP $status"
          cat response.json
          [ "$status" = "200" ]
