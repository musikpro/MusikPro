name: Security Guard

on:
  pull_request:
  push:
    branches: [main, master, staging]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "package-lock.json absent in starter; generating it with npm install"
            npm install
          fi
      - name: Canonical security release gate
        run: npm run security:release
