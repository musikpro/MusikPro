<!doctype html>
<html lang="fr">
  <head>

    <meta name="theme-color" content="#0b1020" />
    <title>Connexion requise</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,

        display: grid;
        min-height: 100vh;

        margin-top: 0;
      }

        line-height: 1.6;
        color: #555;
      }

  <body>
    <main class="card">
      <h1>Connexion internet requise</h1>

        Cette partie du SaaS utilise le serveur Next.js pour l’authentification, les données, les paiements et les

      </p>
    </main>

</html>
